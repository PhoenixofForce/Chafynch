pre-commit:
  jobs:
    - name: backend spotless
      glob: "*.java"
      run: ./mvnw -q com.diffplug.spotless:spotless-maven-plugin:apply
      stage_fixed: true
    - name: frontend eslint
      root: "ui/"
      glob: "ui/src/*.{js,ts,svelte}"
      run: npx eslint --fix {staged_files} || true
      stage_fixed: true
    - name: frontend prettier
      root: "ui/"
      glob: "ui/src/*.{js,ts,svelte,css,html,json,md}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
