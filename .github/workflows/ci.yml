name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backend-deps: ${{ steps.filter.outputs.backend-deps }}
      frontend-deps: ${{ steps.filter.outputs.frontend-deps }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'pom.xml'
              - '.config/**'
              - '.mvn/**'
              - 'mvnw'
            frontend:
              - 'ui/**'
            backend-deps:
              - 'pom.xml'
            frontend-deps:
              - 'ui/package.json'
              - 'ui/package-lock.json'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Check formatting
        run: mvn spotless:check

      - name: Check style
        run: mvn checkstyle:check -Dcheckstyle.failOnViolation=true

      - name: Check licenses
        if: needs.changes.outputs.backend-deps == 'true'
        run: mvn license:add-third-party -Dlicense.failOnBlacklist=true

      - name: Build and test backend
        run: mvn verify -Dcheckstyle.skip=true -Derrorprone.args=

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/package.json
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui

      - name: Check licenses
        if: needs.changes.outputs.frontend-deps == 'true'
        run: npm run license-check
        working-directory: ui

      - name: Check formatting
        run: npm run format
        working-directory: ui

      - name: Lint
        run: npm run lint
        working-directory: ui

      - name: Check
        run: npm run check
        working-directory: ui

      - name: Test
        run: npm run test
        working-directory: ui

      - name: Build
        run: npm run build
        working-directory: ui
