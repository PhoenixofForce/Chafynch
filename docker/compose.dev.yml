name: tea-tracker
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tea_tracker
      POSTGRES_USER: tea_tracker
      POSTGRES_PASSWORD: tea_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tea_tracker -d tea_tracker" ]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
